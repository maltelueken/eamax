[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eamax"
version = "0.1.0"
description = "Evidence accumulation models in JAX: simulation and likelihoods for racing diffusion and related models"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Malte Luken", email = "m.luken@esciencecenter.nl" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = ["jax>=0.9", "numpy"]

[project.optional-dependencies]
# Only needed for `eamax.flows` (the neural spline-flow density estimator).
flows = ["distrax", "flax", "orbax-checkpoint", "optax"]
# Convenience for fresh environments that do not already have tfp-nightly installed.
tfp = ["tensorflow-probability"]
# `eamax.inference` (NUTS + tempered SMC).
inference = ["blackjax>=1.2.5"]
# `eamax.io` only -- reading and writing NetCDF posterior artifacts. Kept out of
# `inference` because sampling and diagnostics need none of it.
io = ["arviz-base", "xarray", "h5netcdf", "h5py"]

[dependency-groups]
dev = ["pytest", "scipy", "pandas", "blackjax>=1.6", "arviz-base", "arviz-stats", "xarray", "h5netcdf", "h5py"]

[tool.hatch.build.targets.wheel]
packages = ["src/eamax"]

[tool.pytest.ini_options]
testpaths = ["tests"]
