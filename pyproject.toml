[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eamax"
version = "0.2.0"
description = "Evidence accumulation models in JAX: simulation and likelihoods for racing diffusion and related models"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Malte Luken", email = "m.luken@esciencecenter.nl" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = ["jax>=0.9", "numpy"]

[project.optional-dependencies]
# Only needed for `eamax.flows` (the neural spline-flow density estimator).
flows = ["distrax", "flax", "orbax-checkpoint", "optax"]
# Convenience for fresh environments that do not already have tfp-nightly installed.
tfp = ["tensorflow-probability"]
# `eamax.inference` (NUTS + tempered SMC).
inference = ["blackjax>=1.2.5"]
# `eamax.io` only -- reading and writing NetCDF posterior artifacts. Kept out of
# `inference` because sampling and diagnostics need none of it.
io = ["arviz-base", "xarray", "h5netcdf", "h5py"]

[dependency-groups]
dev = [
    "pytest",
    "scipy",
    "pandas",
    "blackjax>=1.6",
    "arviz-base",
    "arviz-stats",
    "xarray",
    "h5netcdf",
    "h5py",
    "bump-my-version>=1.5.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/eamax"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.bumpversion]
current_version = "0.2.0"
commit = true
tag = true
tag_name = "v{new_version}"
tag_message = "Release v{new_version}"
message = "Bump version: {current_version} → {new_version}"

[[tool.bumpversion.files]]
filename = "src/eamax/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "## [Unreleased]"
replace = """## [Unreleased]

## [{new_version}] - {now:%Y-%m-%d}"""

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "[Unreleased]: https://github.com/maltelueken/eamax/compare/v{current_version}...HEAD"
replace = """[Unreleased]: https://github.com/maltelueken/eamax/compare/v{new_version}...HEAD
[{new_version}]: https://github.com/maltelueken/eamax/compare/v{current_version}...v{new_version}"""
